plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace = 'com.eddyizm.tempus'
    //noinspection GradleDependency
    compileSdk = 37
    buildToolsVersion = '36.1.0'

    defaultConfig {
        minSdkVersion 24
        //noinspection OldTargetApi
        targetSdk = 37

        versionCode 53
        versionName '4.32.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Drift: Undertow server address and token (from local.properties, not versioned)
        def driftProps = new Properties()
        def lp = rootProject.file('local.properties')
        if (lp.exists()) lp.withInputStream { driftProps.load(it) }
        buildConfigField 'String', 'DRIFT_SIDECAR_URL', "\"${driftProps.getProperty('drift.sidecar.url', '')}\""
        // Drift Lite: no Undertow, charts and YouTube straight from the phone
        buildConfigField 'boolean', 'LITE', 'false'
        buildConfigField 'String', 'DRIFT_SIDECAR_TOKEN', "\"${driftProps.getProperty('drift.sidecar.token', '')}\""
        // Drift Lite: Last.fm API account of the app (local.properties lastfm.key / lastfm.secret); empty = feature hidden
        buildConfigField 'String', 'LASTFM_KEY', "\"${driftProps.getProperty('lastfm.key', '')}\""
        buildConfigField 'String', 'LASTFM_SECRET', "\"${driftProps.getProperty('lastfm.secret', '')}\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    splits {
        abi {
            enable = true
            reset()
            //noinspection ChromeOsAbiSupport
            universalApk = true
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }

    def driftLocal = new Properties()
    if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { driftLocal.load(it) }

    flavorDimensions += "default"

    productFlavors {
        tempus {
            dimension = "default"
            // Drift: overridable from local.properties (drift.applicationId)
            applicationId = driftLocal.getProperty('drift.applicationId', 'io.github.itsjustdeepred.drift')
        }

        degoogled {
            dimension = "default"
            applicationId = "com.eddyizm.degoogled.tempus"
        }

        play {
            dimension = "default"
            applicationId = "com.eddyizm.play.tempus"
        }

        lite {
            dimension = "default"
            applicationId = 'io.github.itsjustdeepred.driftlite'
            // Drift Lite has its own version line, independent from Tempus
            versionCode 7
            versionName '1.1.0'
            buildConfigField 'boolean', 'LITE', 'true'
            buildConfigField 'String', 'DRIFT_SIDECAR_URL', '""'
            buildConfigField 'String', 'DRIFT_SIDECAR_TOKEN', '""'
        }
    }

    // Drift Lite: same code and resources as the Drift build (Android Auto, Cast)
    sourceSets {
        lite {
            java.srcDirs += 'src/tempus/java'
            kotlin.srcDirs += 'src/tempus/java'
            res.srcDirs += 'src/tempus/res'
        }
    }

    // Release signing for Drift Lite: keystore.properties at the path in LITE_KEYSTORE (never in the repo)
    def liteKeystore = System.getenv('LITE_KEYSTORE')
    if (liteKeystore != null && file(liteKeystore).exists()) {
        def ks = new Properties()
        file(liteKeystore).withInputStream { ks.load(it) }
        signingConfigs {
            lite {
                storeFile file(ks.getProperty('storeFile'))
                storePassword ks.getProperty('storePassword')
                keyAlias ks.getProperty('keyAlias')
                keyPassword ks.getProperty('keyPassword')
            }
        }
        productFlavors.lite.signingConfig signingConfigs.lite
    }

    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled = true
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix = ".debug"
            debuggable = true
        }
    }

    compileOptions {
        // Drift Lite: NewPipeExtractor uses recent Java APIs (java.time, nio)
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }

    lint {
        baseline = file("lint-baseline.xml")
        disable += "MissingTranslation"
    }

    sourceSets {
        play {
            java.srcDirs += ['src/tempus/java']
            kotlin.srcDirs += ['src/tempus/java']
            res.srcDirs += ['src/tempus/res']
        }
    }
}

