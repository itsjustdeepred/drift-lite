pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    /*
    Can't use fancy libs.versions.toml notation here
    This thing auto-downloads java for local development (no need to mess with system java)
     */
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Drift Lite: NewPipeExtractor (YouTube search and streams from the phone)
        maven { url 'https://jitpack.io'; content { includeGroup 'com.github.teamnewpipe'; includeGroup 'com.github.TeamNewPipe' } }
    }
}

include ':app'
rootProject.name = "Tempus"